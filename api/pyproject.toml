[project]
name = "cashflow-api"
version = "0.23.0"
description = "Household cash flow API: statement ingestion, categorization and analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "pyodbc>=5.2",
    "alembic>=1.14",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "pdfplumber>=0.11",
    "azure-storage-blob>=12.20",
    "azure-identity>=1.17",
    "pillow>=10.1",
    "pypdf>=5",
    "anthropic>=0.40",
    "mcp>=1.20,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl>=3.1.5.20261017",
    "reportlab>=4.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["pyodbc"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running SQL Server (DATABASE_URL)"]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
