[project]
name = "cashflow-api"
version = "0.116.1"
description = "Household cash flow API: statement ingestion, categorization and analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "pyodbc>=5.2",
    "alembic>=1.14",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "pdfplumber>=0.11",
    "azure-storage-blob>=12.20",
    "azure-identity>=1.17",
    "pillow>=10.1",
    "pypdf>=5",
    "anthropic>=0.40",
    "mcp>=1.20,<2",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl>=3.1.5.20261017",
    "reportlab>=4.2",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Beyond the basics, the rules that hold the project's code standard (docs/definition-of-done.md):
# BLE/S110 no blind or silent excepts; C90 and PLR0915 small functions; D1 a docstring on
# every public module, class and function.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE", "S110", "C90", "PLR0915", "D1"]
ignore = [
    "D105", # magic methods say what they are
    "D107", # __init__ is described by its class
]

[tool.ruff.lint.per-file-ignores]
# A test's name says what it checks; fixtures and long scenario tests are fine as they are.
"tests/**" = ["D1", "C901", "PLR0915", "BLE001"]
# Alembic's upgrade/downgrade are described by the migration's own header.
"migrations/**" = ["D1", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["pyodbc"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running SQL Server (DATABASE_URL)"]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
