name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests, migrations)
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci-Only-Passw0rd!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-Passw0rd!' -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    defaults:
      run:
        working-directory: api
    env:
      APP_ENV: local
      DATABASE_URL: mssql+pyodbc://sa:Ci-Only-Passw0rd!@localhost:1433/cashflow?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    steps:
      - uses: actions/checkout@v4
      - name: ODBC Driver 18
        run: |
          set -x
          if odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then exit 0; fi
          # Runner images usually ship the Microsoft apt repo already; add it only if missing.
          if ! grep -rqs "packages.microsoft.com/ubuntu" /etc/apt/sources.list.d/; then
            curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o /tmp/msprod.deb
            sudo dpkg -i /tmp/msprod.deb
          fi
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc
          odbcinst -q -d
      - name: Tesseract OCR (Pacificard statements are pictures)
        run: sudo apt-get install -y --no-install-recommends tesseract-ocr && tesseract --version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Unit tests with coverage
        run: uv run pytest --cov --cov-report=term-missing
      - name: Create database
        run: uv run python -m app.db.ensure_database
      - name: Integration tests (migrations up, down, up)
        run: |
          set -o pipefail
          uv run pytest -m integration -o addopts="" -rA --tb=short 2>&1 | tee /tmp/integration.log
      - name: Surface integration failure as an annotation
        if: failure()
        run: |
          [ -f /tmp/integration.log ] || exit 0
          echo "::error title=Integration tests::$(tail -80 /tmp/integration.log | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Docker image and end-to-end tests
    runs-on: ubuntu-24.04
    needs: [api, web]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci-Only-Passw0rd!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-Passw0rd!' -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cashflow:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image (migrations run on start)
        run: |
          docker run -d --name app --network host \
            -e APP_ENV=local \
            -e "DATABASE_URL=mssql+pyodbc://sa:Ci-Only-Passw0rd!@localhost:1433/cashflow?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes" \
            cashflow:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Playwright
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: App logs
        if: failure()
        run: docker logs app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
